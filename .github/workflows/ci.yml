name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.17"
          cache: true

      - name: Set up tool bin
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

      - name: Download modules
        run: make download

      - name: Install statik
        run: GOBIN="${RUNNER_TEMP}/bin" go install github.com/rakyll/statik@v0.1.6

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh \
            | sh -s -- -b "${RUNNER_TEMP}/bin" v1.43.0

      - name: Generate runtime
        run: make runtime

      - name: Run linter
        run: make lint

      - name: Run tests
        run: make test

  ci-result:
    name: CI / Required
    runs-on: ubuntu-latest
    needs:
      - ci
    if: ${{ always() }}

    steps:
      - name: Check CI result
        run: |
          if [ "${{ needs.ci.result }}" != "success" ]; then
            echo "CI failed or was cancelled"
            exit 1
          fi
